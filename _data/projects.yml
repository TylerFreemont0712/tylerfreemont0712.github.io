    image_alt_ja: Ty Work Hubの「Today」画面（デモデータ）。タスク数、次の作業キュー、作業タイマー、今後の締切、直近7日間の作業時間グラフが表示されています。

  - id: localsync
    item: 7
    from: "2026.03"
    to: "2026.05"
    group: apps
    tier: card
    name: LocalSync
    year: 2026
    status: paused
    repo: https://github.com/TylerFreemont0712/LocalSyncOrganization
    summary: >-
      Tasks, calendar, earnings and Obsidian notes synced between my own machines
      over the LAN with no server — subnet discovery, last-write-wins merge, and a
      vault watcher tuned to Obsidian's atomic saves. Also a 13-stage receipt OCR
      pipeline that cross-checks the LLM's parse against a regex parse.
    summary_ja: >-
      タスク・予定・収支・Obsidianのノートを、サーバを介さずLAN内の自分の端末間で同期するアプリ。サブネット探索、last-write-winsによる統合、Obsidianの保存挙動に合わせた監視処理に加え、LLMと正規表現の解析結果を突き合わせる13段階のレシートOCRを備えます。
    stack: [Python, PyQt6, SQLite, PaddleOCR, llama.cpp]
    spec: 20.7k LOC · 14 tables · 18 agent tools
    spec_ja: 約2.1万行 · テーブル14 · ツール18種

