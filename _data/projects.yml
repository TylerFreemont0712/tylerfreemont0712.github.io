# ══════════════════════════════════════════════════════════════════════
# The parts list. Every project on the site, in one place.
#
#   tier: sheet   — has its own drawing sheet (case study) under /projects/<id>/
#         card    — listed with a description and a link
#         lab     — one line in the lab drawer
#   from/to: months of active work (YYYY.MM), for the timeline
#   status: active | paused | done | private
#   repo: public source URL; empty for private work, which is described but
#         never linked.
#   spec: measured figures only. Each one was counted from the repository
#         (line counts exclude vendored code, lockfiles and generated files);
#         see the notes on each project sheet for how.
#
# Repositories deliberately absent: Dashboard, AIAgent, OrchCheck and
# ServerStarter are empty; LammaStart and llama-launcher are earlier copies
# of llama-launcher-2; Work is employer-owned; Sales is a stub.
# ══════════════════════════════════════════════════════════════════════

groups:
  - id: games
