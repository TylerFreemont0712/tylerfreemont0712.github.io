    image_alt: A chat turn in AIOS where a 1.7B local model calls web_search through self-hosted SearXNG, shows the raw results, then answers at 135.4 tokens per second.
    image_alt_ja: AIOSのチャット画面。ローカルの1.7Bモデルが自前のSearXNG経由でweb_searchを呼び出し、取得した結果を表示したうえで毎秒135.4トークンで回答しています。

  - id: llama-launcher
    item: 3
    from: "2026.05"
    to: "2026.06"
    group: ai
    tier: card
    name: Local AI server launcher
    year: 2026
    status: done
    repo: https://github.com/TylerFreemont0712/llama-launcher-2
    summary: >-
      A PyQt6 front end for llama.cpp, faster-whisper and MusicGen servers. The
      form and the live command preview are generated from one flag table, and
