    item: 1
    from: "2026.09"
    to: "2026.10"
    group: games
    tier: sheet
    name: Rootward
    year: 2026
    status: active
    repo: https://github.com/TylerFreemont0712/rootward-godot
    summary: >-
      A programming roguelite in Godot 4.7. Every spell is a real Python or
      JavaScript function run in a WASI sandbox, and Big-O decides who acts first.
    summary_ja: >-
      Godot 4.7製のプログラミング・ローグライト。呪文はすべて本物のPython／JavaScript関数で、WASIサンドボックス上で実行され、計算量が先手を決めます。
    stack: [Godot 4.7, GDScript, wasmtime, CPython, QuickJS]
    spec: 31k LOC · 390 tests · EN/JA
    spec_ja: 約3.1万行 · テスト390件 · 日英対応
    image: /assets/program-images/rootward-keyart.webp
    image_alt: Rootward title art — the wordmark over an underground brass-elevator foundry lit by lanterns.
    image_alt_ja: Rootwardのタイトル画像。ランタンに照らされた地下の真鍮製エレベーター工房の上にロゴが配置されています。

  - id: aios
