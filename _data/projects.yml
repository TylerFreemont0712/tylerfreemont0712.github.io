    summary_ja: >-
      LAN全体に提供する自作のAI作業環境。ローカル／クラウドのモデルを単一のプロバイダ層で扱い、承認制のコーディングエージェント、MCP、実端末、コードで採点するモデル評価基盤を備えます。
