    summary_ja: >-
      llama.cpp・faster-whisper・MusicGenの各サーバをGUIから起動するPyQt6製ツール。フォームとコマンドのプレビューは1つのフラグ定義表から生成し、3つのプロセスを共通の監視クラスで管理します。
    stack: [Python, PyQt6, FastAPI, llama.cpp, faster-whisper]
    spec: 2.5k LOC · 53 flags · 3 servers
    spec_ja: 約2,500行 · 53項目 · サーバ3種

  - id: llm-council
    item: 4
