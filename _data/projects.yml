    summary_ja: >-
      役割を分担したエージェントがHTML5 Canvasのゲームを一から構築するシステム。共通のツール層を介して連携し、生成コードはディスクに書き込む前にASTレベルで検証します（名前の解決、呼び出しと定義の整合）。
    stack: [Python, Multi-agent, AST analysis, HTML5 Canvas]
    spec: Source not public
    spec_ja: ソース非公開

  - id: command-center
    item: 5
    from: "2026.06"
    to: "2026.06"
    group: ai
    tier: card
    name: Command Center
    year: 2026
    status: private
    repo: ""
    summary: >-
      A prototype engine for YAML-defined agent workflows: loops, branches,
      human approval gates and parallel judge votes, with every call routed through
      a deny-by-default permission broker and an append-only event journal.
    summary_ja: >-
      YAMLで定義したエージェントのワークフロー（ループ、分岐、人による承認、複数の審査役による投票）を実行する試作エンジン。すべての呼び出しは既定拒否の権限管理と追記型のイベント記録を通ります。
    stack: [TypeScript, Node, React, SQLite]
    spec: 4.8k LOC · prototype
    spec_ja: 約4,800行 · 試作

