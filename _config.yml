title: Tyler Freemont
description: >-
  Software Engineer, AI Systems — local LLM infrastructure, MCP servers and RAG
  pipelines. Osaka, Japan. Native English, JLPT N1, AWS certified, no visa
  sponsorship required.

url: https://tylerfreemont0712.github.io
baseurl: ""
lang: en

theme: jekyll-theme-hacker

# The 1200x630 social card lives at /assets/og-image.png and is wired up
# explicitly in _layouts/default.html. It is not configured here: we tried
# `image:` plus a `twitter:` block for jekyll-seo-tag and the plugin ignored
# both, shipping pages with no og:image and a bare "@" for twitter:site.

plugins:
  - jekyll-sitemap
  - jekyll-feed

# jekyll-feed defaults to /feed.xml. Posts carry lang: en or ja; the feed
# includes both, which is correct for a bilingual author.
feed:
  path: feed.xml

defaults:
  - scope:
      type: posts
    values:
      layout: post
      lang: en

sass:
  style: compressed

# Nothing here should ship to the built site.
exclude:
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - README.md
  - vendor
