title: Tyler Freemont
description: >-
  Software engineer in Osaka building AI systems and games — local LLM
  infrastructure, MCP servers, agent tooling, model evaluation, and a Godot
  roguelite whose spells are real code. Native English, JLPT N1, AWS certified,
  no visa sponsorship required.

url: https://tylerfreemont0712.github.io
baseurl: ""
lang: en

# No theme: every layout, include and stylesheet in this repo is custom.
# The 1200x630 social card at /assets/og-image.png is wired up explicitly in
# _layouts/default.html rather than through jekyll-seo-tag, which ignored it.

plugins:
  - jekyll-sitemap
  - jekyll-feed

# jekyll-feed defaults to /feed.xml. Posts carry lang: en or ja; the feed
# includes both, which is correct for a bilingual author.
feed:
  path: feed.xml

# One document per project sheet and language. Each sets its own permalink
# (/projects/<slug>/ or /ja/projects/<slug>/) and alt_url.
collections:
  projects:
    output: true

defaults:
  - scope:
      type: posts
    values:
      layout: post
      lang: en
      nav: writing
      dwg: TF-004
      sheet: "04"
  - scope:
      type: projects
    values:
      layout: sheet
      nav: projects
      lang: en

exclude:
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - README.md
  - vendor
  - tools
  - .bundle
