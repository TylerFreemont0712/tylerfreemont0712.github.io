title: Tyler Freemont
description: >-
  Software Engineer, AI Systems — local LLM infrastructure, MCP servers and RAG
  pipelines. Osaka, Japan. Native English, JLPT N1, AWS certified, no visa
  sponsorship required.

url: https://tylerfreemont0712.github.io
baseurl: ""
lang: en

theme: jekyll-theme-hacker

# Consumed by jekyll-seo-tag for og:image / twitter:image. 1200x630 card
# carrying the title, positioning and the three credibility points, so a
# link pasted into Slack or LinkedIn makes the pitch on its own.
image: /assets/og-image.png
twitter:
  card: summary_large_image

plugins:
  - jekyll-seo-tag
  - jekyll-sitemap

sass:
  style: compressed

# Nothing here should ship to the built site.
exclude:
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - README.md
  - vendor
