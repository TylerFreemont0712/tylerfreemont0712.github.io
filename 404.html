<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>404 — command not found · Tyler Freemont</title>
  <meta name="robots" content="noindex">
  <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
  <style>
    :root { --accent:#34e3c4; --accent2:#9d7bff; }
    * { box-sizing: border-box; }
    body { margin:0; min-height:100vh; background:#0a0d14; color:#e7edf5;
      font-family:'JetBrains Mono',monospace; display:flex; align-items:center; justify-content:center; padding:24px;
      background-image: radial-gradient(800px 500px at 70% -10%, rgba(52,227,196,.14), transparent 60%), radial-gradient(700px 500px at 10% 10%, rgba(157,123,255,.10), transparent 60%); }
    .box { width:min(560px,92vw); background:#111722; border:1px solid #222b3d; border-radius:14px; overflow:hidden;
      box-shadow:0 30px 80px -30px rgba(0,0,0,.8); }
    .bar { display:flex; align-items:center; gap:8px; padding:11px 14px; background:rgba(0,0,0,.25); border-bottom:1px solid #222b3d; }
    .bar i { width:11px; height:11px; border-radius:50%; display:block; }
    .bar i:nth-child(1){background:#ff5f57;} .bar i:nth-child(2){background:#febc2e;} .bar i:nth-child(3){background:#28c840;}
    .bar span { margin-left:8px; font-size:11.5px; color:#5d6b81; }
    .body { padding:26px 22px 30px; font-size:13.5px; line-height:1.9; }
    .ps { color:#5ef38c; } .ac { color:var(--accent); } .muted { color:#5d6b81; } .err { color:#ff6b81; }
    h1 { font-family:'Space Grotesk',sans-serif; font-size:64px; margin:6px 0 2px;
      background:linear-gradient(120deg,#fff,var(--accent) 60%,var(--accent2)); -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent; }
    a.home { display:inline-block; margin-top:18px; color:#0a0d14; background:var(--accent); padding:10px 18px; border-radius:9px; text-decoration:none; font-weight:500; font-size:13px; }
    a.home:hover { opacity:.9; }
  </style>
</head>
<body>
  <div class="box">
    <div class="bar"><i></i><i></i><i></i><span>tyler@osaka: ~/404</span></div>
    <div class="body">
      <div><span class="ps">tyler@osaka</span><span class="muted">:</span><span class="ac">~</span><span class="muted">$</span> cd <span class="ac">this-page</span></div>
      <div class="err">cd: no such file or directory</div>
      <h1>404</h1>
      <div class="muted">the route resolved to nothing — like a model with no weights loaded.</div>
      <div style="margin-top:10px"><span class="ps">tyler@osaka</span><span class="muted">:</span><span class="ac">~</span><span class="muted">$</span> cd <span class="ac">/</span></div>
      <a class="home" href="/">↩ back to home</a>
    </div>
  </div>
</body>
</html>
