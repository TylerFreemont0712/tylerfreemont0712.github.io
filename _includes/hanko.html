{%- comment -%}
  A hanko (name seal) in フリーモント, set in two vertical columns the way a
  seal is cut: right column first. The long-vowel mark is rotated, as it is in
  vertical Japanese. Decorative — the name is in the text beside it.
{%- endcomment -%}
<svg class="hanko" viewBox="0 0 64 64" aria-hidden="true" focusable="false">
  <circle cx="32" cy="32" r="28.5"/>
  <circle cx="32" cy="32" r="25" style="stroke-width:1"/>
  <g text-anchor="middle" dominant-baseline="central">
    <text x="40.5" y="19">フ</text>
    <text x="40.5" y="32.5">リ</text>
    <text x="40.5" y="46" transform="rotate(90 40.5 46)">ー</text>
    <text x="23.5" y="19">モ</text>
    <text x="23.5" y="32.5">ン</text>
    <text x="23.5" y="46">ト</text>
  </g>
</svg>
